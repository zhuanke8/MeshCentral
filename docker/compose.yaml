services:
  meshcentral:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DISABLE_TRANSLATE: "no"   # 生成多语言页面（含 WebDAV 中文翻译）；构建会多花几分钟
    # image: ghcr.io/ylianst/meshcentral:latest  # 官方原版镜像，这里改为本地构建（包含 WebDAV）
    restart: unless-stopped
    environment:
      - DYNAMIC_CONFIG=false
      - HOSTNAME=myserver.domain.com     # 改成面板域名，客户端安装脚本和 WebDAV 地址都用它
      - PORT=443
      - REDIR_PORT=80
      - ALLOW_NEW_ACCOUNTS=false
      - USE_MONGODB=false                # 默认内置数据库；使用 MongoDB 时改为 true 并启用下面的 mongodb 服务
      # - MONGO_URL=mongodb://username:password@mongodb:27017/meshcentral
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-web:/opt/meshcentral/meshcentral-web   # 注意：这里放的自定义页面会覆盖内置页面（含 WebDAV 面板）
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    ports:
      - 443:443
      - 80:80
  # mongodb:
  #   image: mongo:7
  #   restart: unless-stopped
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=username
  #     - MONGO_INITDB_ROOT_PASSWORD=password
  #   volumes:
  #     - mongodb-data:/data/db
volumes:
  meshcentral-data:
  meshcentral-files:
  meshcentral-web:
  meshcentral-backups:
  # mongodb-data:
